<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" stroke="#1e293b" stroke-width="4"/>

  <!-- Outer Watch Bezel / Instrument Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#1e293b" stroke-width="6" />
  <circle cx="256" cy="256" r="184" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 9" opacity="0.4" />

  <!-- Oscilloscope Grid Lines -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="256" y1="80" x2="256" y2="432" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Mechanical Balance Wheel Spokes (Horology) -->
  <g transform="rotate(25, 256, 256)" opacity="0.85">
    <circle cx="256" cy="256" r="140" fill="none" stroke="#475569" stroke-width="8"/>
    <!-- Balance Screws on Rim -->
    <circle cx="256" cy="116" r="6" fill="#fbbf24"/>
    <circle cx="256" cy="396" r="6" fill="#fbbf24"/>
    <circle cx="116" cy="256" r="6" fill="#fbbf24"/>
    <circle cx="396" cy="256" r="6" fill="#fbbf24"/>
    <circle cx="157" cy="157" r="5" fill="#94a3b8"/>
    <circle cx="355" cy="355" r="5" fill="#94a3b8"/>
    <circle cx="157" cy="355" r="5" fill="#94a3b8"/>
    <circle cx="355" cy="157" r="5" fill="#94a3b8"/>

    <!-- Arms -->
    <line x1="120" y1="256" x2="392" y2="256" stroke="#475569" stroke-width="6"/>
    <line x1="256" y1="120" x2="256" y2="392" stroke="#475569" stroke-width="6"/>
  </g>

  <!-- Hairspring Center Jewel -->
  <circle cx="256" cy="256" r="22" fill="#ef4444" opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#f43f5e"/>
  <circle cx="256" cy="256" r="5" fill="#ffffff"/>

  <!-- Oscilloscope Timegrapher Waveform / Escapement Acoustic Pulse -->
  <path d="M 80,256 L 150,256 L 170,250 L 180,265 L 195,190 L 205,310 L 215,240 L 230,270 L 245,256 L 270,256 L 285,150 L 295,350 L 308,220 L 320,290 L 335,256 L 432,256"
        fill="none"
        stroke="url(#cyanGrad)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Rate Deviation Zero Target Crossbar & Glow Marker -->
  <line x1="120" y1="256" x2="392" y2="256" stroke="#06b6d4" stroke-width="2" opacity="0.8" />
  <circle cx="295" cy="150" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="195" cy="190" r="6" fill="#fbbf24" filter="url(#glow)"/>
</svg>
